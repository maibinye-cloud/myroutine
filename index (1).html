<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- ===== PWA：iOS 全螢幕 / 加入主畫面 ===== -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyRoutine">
<meta name="theme-color" content="#0b100d">
<meta name="description" content="MyRoutine 作息管理 PWA：作息習慣、待辦事項、時間表">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>MyRoutine · 作息管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230e1410'/%3E%3Ccircle cx='12' cy='12' r='7' fill='%234CD964'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#0b100d; --panel:#121a14; --panel2:#18231b; --line:#223026; --line2:#2c3d30;
  --txt:#e8efe9; --sub:#93a89a; --dim:#5f7164; --green:#4CD964; --green-d:#2f9e4b;
  --green-bg:rgba(76,217,100,.12); --amber:#f5b942; --red:#ff6b6b; --blue:#5aa9ff;
  --radius:16px; --radius-s:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:15px;line-height:1.55;
  overscroll-behavior:none;min-height:100vh}
body.light{--bg:#f4f7f4;--panel:#ffffff;--panel2:#eef3ee;--line:#e0e8e0;--line2:#cfdccf;
  --txt:#15201a;--sub:#5d7265;--dim:#93a69a;--green-bg:rgba(76,217,100,.15)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line2);
  border-radius:var(--radius-s);padding:10px 12px;font-size:15px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}

/* ===== App shell ===== */
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
header.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:.5px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--green-bg);display:grid;place-items:center;color:var(--green)}
.brand .logo svg{width:18px;height:18px}
.top-spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--sub);transition:.15s}
.iconbtn:hover{background:var(--panel2);color:var(--txt)}
.iconbtn svg{width:20px;height:20px}

/* Month nav */
.monthnav{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 4px}
.monthnav .mv{font-size:17px;font-weight:600}
.monthnav .arrows{display:flex;gap:6px}
.monthnav .arrows button{width:34px;height:34px;border-radius:9px;color:var(--sub);display:grid;place-items:center}
.monthnav .arrows button:hover{background:var(--panel2);color:var(--txt)}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 18px 10px}
.weekstrip .wd{text-align:center;font-size:11px;color:var(--dim);padding:2px 0}
.weekstrip .day{text-align:center;font-size:13px;padding:6px 0;border-radius:9px;color:var(--sub);cursor:pointer;position:relative}
.weekstrip .day.today{background:var(--green-bg);color:var(--green);font-weight:700}
.weekstrip .day.hit::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--green)}

/* Sections */
main{flex:1;padding:8px 18px 110px}
.view{display:none;animation:fade .2s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sechead{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}
.sechead h2{font-size:15px;font-weight:700}
.sechead .muted{color:var(--dim);font-size:13px;font-weight:400}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--green-bg);color:var(--green);font-weight:600}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.habit-row{display:flex;align-items:center;gap:13px;padding:14px 16px}
.habit-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex-shrink:0}
.habit-icon svg{width:22px;height:22px}
.habit-meta{flex:1;min-width:0}
.habit-name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.habit-cat{font-size:11px;color:var(--dim);padding:2px 7px;background:var(--panel2);border-radius:6px}
.habit-sub{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.habit-sub .streak{color:var(--green);display:inline-flex;align-items:center;gap:3px}
.checkbtn{width:52px;height:52px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;
  color:transparent;flex-shrink:0;transition:.18s;background:transparent;position:relative}
.checkbtn svg{width:24px;height:24px}
.checkbtn.on{border-color:var(--green);background:var(--green);color:#06240f;box-shadow:0 0 0 5px var(--green-bg),0 4px 16px rgba(76,217,100,.35)}
.checkbtn.on::after{content:'✓';position:absolute;font-size:0}
.checkbtn.timeval{width:auto;border-radius:24px;border-color:var(--green);padding:0 14px;color:var(--green);
  font-weight:700;font-size:15px;height:44px}
.checkbtn.timeval.on{background:var(--green);color:#06240f}
.habit-row.miss{opacity:.55}

/* filter chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 13px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--sub)}
.chip.on{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}

/* todo */
.todo-item{display:flex;align-items:flex-start;gap:12px}
.todo-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0;display:grid;place-items:center;margin-top:1px;color:transparent;transition:.15s}
.todo-item.done .todo-check{background:var(--green);border-color:var(--green);color:#06240f}
.todo-item.done .todo-title{text-decoration:line-through;color:var(--dim)}
.todo-body{flex:1;min-width:0}
.todo-title{font-weight:500}
.todo-note{font-size:12px;color:var(--dim);margin-top:1px}
.todo-meta{display:flex;gap:8px;font-size:11px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:6px}
.tag.hi{background:rgba(255,107,107,.14);color:var(--red)}
.tag.mid{background:rgba(245,185,66,.14);color:var(--amber)}
.tag.lo{background:var(--panel2);color:var(--sub)}
.todo-actions{display:flex;gap:2px;flex-shrink:0}
.todo-actions button{width:38px;height:38px;border-radius:10px;color:var(--dim);display:grid;place-items:center}
.todo-actions button:hover{background:var(--panel2);color:var(--red)}
.todo-actions svg{width:18px;height:18px}

/* stats dashboard */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center}
.stat .num{font-size:24px;font-weight:700;color:var(--green)}
.stat .lbl{font-size:12px;color:var(--sub);margin-top:2px}
.habit-stat{display:flex;align-items:center;gap:12px;padding:13px 15px}
.hs-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.hs-icon svg{width:18px;height:18px}
.hs-meta{flex:1;min-width:0}
.hs-name{font-weight:600;font-size:14px}
.hs-sub{font-size:12px;color:var(--dim)}
.hs-bar{flex:1.2;height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;min-width:60px}
.hs-bar i{display:block;height:100%;background:var(--green);border-radius:6px;transition:.3s}
.hs-pct{font-weight:700;font-size:14px;color:var(--green);width:40px;text-align:right}

/* mini calendar grid */
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.mini-grid span{aspect-ratio:1;display:grid;place-items:center;font-size:10px;color:var(--dim);border-radius:5px}
.mini-grid span.h{background:var(--green);color:#06240f;font-weight:700}

/* big calendar (monthly record) */
.bigcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.bigcal .bd{text-align:center;font-size:11px;color:var(--dim);padding:3px 0}
.bigcal .cell{aspect-ratio:1;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--dim);position:relative;min-height:44px}
.bigcal .cell.empty{background:transparent;border-color:transparent}
.bigcal .cell.today{border-color:var(--green)}
.bigcal .cell.on{background:var(--green);color:#06240f;font-weight:700;border-color:var(--green)}
.bigcal .cell .val{font-size:10px;font-weight:600;margin-top:1px}
.bigcal .cell .memo-dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--amber)}

/* chart */
.chartbox{height:220px;margin:6px 0 4px}
.range-seg{display:flex;gap:6px}
.range-seg button{padding:5px 11px;border-radius:8px;font-size:12px;color:var(--sub);border:1px solid var(--line);background:var(--panel)}
.range-seg button.on{background:var(--green-bg);color:var(--green);border-color:var(--green)}

/* memos */
.memo-item{padding:10px 0;border-bottom:1px solid var(--line)}
.memo-item:last-child{border-bottom:none}
.memo-date{font-size:12px;color:var(--green);font-weight:600}
.memo-text{font-size:14px;margin-top:2px;white-space:pre-wrap}

/* achievements */
.ach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ach{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center}
.ach .a-icon{font-size:0;margin-bottom:6px}
.ach .a-icon svg{width:30px;height:30px}
.ach .a-name{font-weight:600;font-size:13px}
.ach .a-desc{font-size:11px;color:var(--dim);margin-top:2px}
.ach.locked{opacity:.4;filter:grayscale(.7)}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .s-label{font-weight:500}
.set-row .s-desc{font-size:12px;color:var(--dim)}
.switch{width:46px;height:27px;border-radius:20px;background:var(--line2);position:relative;transition:.2s;flex-shrink:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--green)}
.switch.on::after{left:22px}
.set-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;
  font-size:14px;font-weight:600;transition:.15s}
.btn.primary{background:var(--green);color:#06240f}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--txt)}
.btn.ghost:hover{border-color:var(--green)}
.btn.danger{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.3)}
.btn svg{width:18px;height:18px}

/* ===== 時間表 ===== */
.sch-month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sch-dow{text-align:center;font-size:11px;color:var(--dim);padding:2px 0}
.sch-cell{border-radius:12px;background:var(--panel);border:1px solid var(--line);
  display:flex;flex-direction:column;padding:5px 6px;cursor:pointer;position:relative;min-height:70px;height:70px;transition:.15s;overflow:hidden}
.sch-cell:hover{border-color:var(--green)}
.sch-cell.today{border-color:var(--green);background:var(--green-bg)}
.sch-cell.empty{background:transparent;border-color:transparent;cursor:default}
.sch-cell .dnum{font-size:13px;color:var(--txt);font-weight:600;align-self:flex-start}
.sch-cell .dnum.fade{color:var(--dim)}
.sch-cell .dinfo{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.sch-cell .dinfo .dcnt{font-size:10px;color:var(--green);font-weight:600}
.sch-cell .dinfo .dhrs{font-size:10px;color:var(--sub)}
.sch-cell .mlabs{display:flex;flex-direction:column;gap:2px;margin-top:3px;min-width:0;width:100%}
.sch-cell .mlab{font-size:9px;line-height:1.4;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:#fff}
.sch-cell .mmore{font-size:9px;color:var(--sub);font-weight:700;padding-left:2px}
.sch-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sch-toolbar .date-pick{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.sch-toolbar .date-pick button{width:28px;height:28px;border-radius:8px;color:var(--sub);display:grid;place-items:center}
.sch-toolbar .date-pick button:hover{background:var(--panel2);color:var(--txt)}
.sch-toolbar .dp-label{font-weight:600;font-size:14px;min-width:120px;text-align:center}

/* 24 小時時間軸 */
.axis-scroll{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.axis-hours{position:relative;width:max-content;min-width:100%}
.axis-hourrow{display:flex;height:54px;border-bottom:1px solid var(--line);position:relative}
.axis-hourrow:last-child{border-bottom:none}
.axis-timelabel{width:52px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:flex-end;padding-right:8px;padding-top:4px;font-size:11px;color:var(--dim);border-right:1px solid var(--line)}
.axis-track{flex:1;position:relative;min-width:420px}
.axis-block{position:absolute;left:4px;right:4px;border-radius:9px;padding:6px 8px;cursor:grab;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;flex-direction:column;justify-content:flex-start;z-index:5;
  touch-action:none;-webkit-user-select:none;user-select:none}
.axis-block.done{opacity:.5}
.axis-block .blk-name{font-weight:700;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 34px)}
.axis-block .blk-time{font-size:11px;color:rgba(255,255,255,.85);max-width:calc(100% - 34px)}
.axis-block .blk-x{position:absolute;top:4px;right:4px;width:32px;height:32px;display:grid;place-items:center;font-size:18px;font-weight:700;
  color:#fff;background:rgba(0,0,0,.42);border-radius:50%;z-index:6;box-shadow:0 1px 4px rgba(0,0,0,.3);line-height:1}
.axis-block .blk-x:active{background:rgba(255,107,107,.9)}
.axis-block .blk-recur{position:absolute;top:5px;right:40px;font-size:12px;color:rgba(255,255,255,.9);z-index:6;pointer-events:none}
.axis-block .blk-grip{position:absolute;bottom:0;left:0;right:0;height:10px;cursor:ns-resize;border-radius:0 0 9px 9px;touch-action:none}
.axis-block .blk-grip::after{content:'';position:absolute;left:50%;top:4px;transform:translateX(-50%);width:20px;height:3px;border-radius:3px;background:rgba(255,255,255,.6)}
.axis-now{position:absolute;left:0;right:0;border-top:2px dashed var(--green);z-index:4;pointer-events:none}
.axis-now span{position:absolute;left:6px;top:-10px;background:var(--green);color:#06240f;font-size:10px;padding:1px 6px;border-radius:5px}

/* 任務庫 */
.tasklib{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.taskchip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;font-size:13px;color:var(--txt);
  border:1px solid var(--line);background:var(--panel);cursor:pointer;user-select:none}
.taskchip .c-dot{width:10px;height:10px;border-radius:50%}
.taskchip.dragging{opacity:.5}
.taskchip .c-x{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--dim);flex-shrink:0}
.taskchip .c-x:hover{background:var(--panel2);color:var(--red)}
.taskchip .c-x:active{color:var(--red)}
.tasklib-add{border:1px dashed var(--line2);background:transparent;color:var(--sub)}
.tasklib-add:hover{border-color:var(--green);color:var(--green)}
.drop-hint{font-size:12px;color:var(--dim);margin:6px 2px 12px}
.drop-hint b{color:var(--green)}
.axis-placeholder{position:absolute;left:4px;right:4px;border:2px dashed var(--green);border-radius:9px;background:var(--green-bg);z-index:3;pointer-events:none}
@media(min-width:600px){.axis-track{min-width:560px}}

/* ===== 每週重複：週視圖（範本編輯） ===== */
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.weekgrid .wk-dow{text-align:center;font-size:11px;color:var(--dim);padding:6px 0;border-bottom:1px solid var(--line);background:var(--panel2);position:relative;z-index:8}
.weekgrid .wk-dow.today{color:var(--green);font-weight:700}
.weekgrid .wk-col{position:relative;height:600px;background:var(--panel)}
.weekgrid .wk-hourrow{position:absolute;left:0;right:0;height:25px;border-bottom:1px solid var(--line);box-sizing:border-box}
.weekgrid .wk-block{position:absolute;left:3px;right:3px;border-radius:7px;padding:2px 6px;overflow:hidden;cursor:grab;
  touch-action:none;-webkit-user-select:none;user-select:none;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.weekgrid .wk-block .wk-name{font-size:10px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.weekgrid .wk-block .wk-time{font-size:9px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weekgrid .wk-block .wk-x{position:absolute;top:1px;right:1px;width:22px;height:22px;display:grid;place-items:center;font-size:14px;font-weight:700;
  color:#fff;background:rgba(0,0,0,.38);border-radius:50%;z-index:6}
.weekgrid .wk-block .wk-x:active{background:rgba(255,107,107,.9)}
.weekgrid .wk-placeholder{position:absolute;left:3px;right:3px;border:2px dashed var(--green);border-radius:7px;background:var(--green-bg);z-index:3;pointer-events:none}
.sch-modebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sch-modebar .hint{margin:0;font-size:12px}

/* FAB */
.fab{position:fixed;bottom:88px;right:max(18px,calc((100vw - 720px)/2 + 18px));z-index:30;width:58px;height:58px;
  border-radius:50%;background:var(--green);color:#06240f;display:grid;place-items:center;box-shadow:0 8px 24px rgba(76,217,100,.4)}
.fab svg{width:26px;height:26px}
.fab:hover{filter:brightness(1.08);transform:scale(1.05)}

/* bottom nav */
nav.bottombar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:720px;z-index:40;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
nav.bottombar .nb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:10px;color:var(--dim)}
nav.bottombar .nb.on{color:var(--green)}
nav.bottombar .nb.on{background:var(--green-bg)}
nav.bottombar .nb svg{width:22px;height:22px}
nav.bottombar .nb span{font-size:11px;font-weight:500}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.overlay .sheet{background:var(--panel);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:20px 20px 26px;
  max-height:88vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .s-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet .s-head h3{font-size:17px;font-weight:700}
.sheet .close{width:34px;height:34px;border-radius:9px;color:var(--dim);display:grid;place-items:center}
.sheet .close:hover{background:var(--panel2)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--sub)}
.iconpick{display:flex;flex-wrap:wrap;gap:8px}
.iconpick button{width:40px;height:40px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--sub)}
.iconpick button.on{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.iconpick svg{width:20px;height:20px}
.colorpick{display:flex;gap:8px;flex-wrap:wrap}
.colorpick button{width:32px;height:32px;border-radius:50%;border:2px solid transparent}
.colorpick button.on{border-color:#fff;box-shadow:0 0 0 2px var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet .s-actions{display:flex;gap:10px;margin-top:18px}
.sheet .s-actions .btn{flex:1}
.sheet .danger-zone{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}

/* time picker */
.timequick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.timequick button{padding:7px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--sub)}
.timequick button.on{border-color:var(--green);color:var(--green);background:var(--green-bg)}

/* toast + confetti */
#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(20px);z-index:60;
  background:var(--panel2);border:1px solid var(--green);color:var(--txt);padding:11px 20px;border-radius:14px;
  font-size:14px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;width:8px;height:8px;border-radius:2px;z-index:65;pointer-events:none;animation:fall 1.2s ease forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg);opacity:0}}

.empty{text-align:center;padding:40px 20px;color:var(--dim)}
.empty .e-icon{font-size:0;margin-bottom:12px}
.empty .e-icon svg{width:54px;height:54px;opacity:.5}
.empty p{font-size:14px}

.list-enter{animation:fade .2s ease}
.hint{font-size:12px;color:var(--dim);margin:8px 2px;line-height:1.5}
@media(min-width:600px){
  .overlay .sheet{border-radius:22px;margin:auto 20px;width:560px}
  .overlay{align-items:center}
}

<script>
/* ===== 資料層 ===== */
const LS = {habits:'mr_habits', checkins:'mr_checkins', todos:'mr_todos', memos:'mr_memos', settings:'mr_settings', achievements:'mr_ach', tasks:'mr_tasks', schedule:'mr_schedule', weekly:'mr_weekly', weeklyOvr:'mr_weeklyOvr'};
function load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let state={
  habits: load(LS.habits,[]),
  checkins: load(LS.checkins,{}),     // {habitId:{date:'value'}}
  todos: load(LS.todos,[]),
  memos: load(LS.memos,{}),           // {habitId:{date:'text'}}
  settings: load(LS.settings,{notify:false,theme:'dark'}),
  achievements: load(LS.achievements,{}),
  tasks: load(LS.tasks,[]),           // 時間表任務庫 {id,name,color}
  schedule: load(LS.schedule,{}),      // {dateISO:{blockId:{taskId,start,end,done,todoId}}}
  weekly: load(LS.weekly,[]),          // 每週範本 [{id,day(0-6),start,end,taskId}]
  weeklyOvr: load(LS.weeklyOvr,{}),    // 每日覆寫 {dateISO:{templateId:{done,hidden}}}
  catOrder: load(LS.catOrder,[])       // 習慣分類的顯示順序
};
const persist=()=>{save(LS.habits,state.habits);save(LS.checkins,state.checkins);save(LS.todos,state.todos);save(LS.memos,state.memos);save(LS.settings,state.settings);save(LS.achievements,state.achievements);save(LS.tasks,state.tasks);save(LS.schedule,state.schedule);save(LS.weekly,state.weekly);save(LS.weeklyOvr,state.weeklyOvr);save(LS.catOrder,state.catOrder)};

/* 舊版資料遷移：schedule 由 {date:{taskId:{start,end,done,todoId}}} 升級為
   {date:{blockId:{taskId,start,end,done,todoId}}}，允許同一任務一天內佔多個時間段 */
function migrateSchedule(){
  let changed=false;
  Object.keys(state.schedule).forEach(ds=>{
    const day=state.schedule[ds];
    Object.keys(day).forEach(k=>{
      const b=day[k];
      if(b&&typeof b==='object'&&b.taskId===undefined){
        const nb={taskId:k,start:b.start??0,end:b.end??(b.start??0)+1,done:!!b.done};
        if(b.todoId!==undefined)nb.todoId=b.todoId;
        day[uid()]=nb;delete day[k];changed=true;
      }
    });
  });
  if(changed)persist();
}

/* ===== 工具 ===== */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtCN(d){return `${d.getMonth()+1}月${d.getDate()}日`}
function fmtDateCN(isoStr){const[d]=isoStr.split(' ');const[x,y,z]=d.split('-');return `${+x}年${+y}月${+z}日`}
function todayFull(){const n=new Date();return `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日`}

// 習慣是否該日執行
function habitScheduled(h,dateISO){
  if(h.frequency==='daily')return true;
  const d=new Date(dateISO+'T12:00:00');
  return (h.days||[]).includes(d.getDay());
}
// 連續天數：從今天往回（含寬限期：隔天中午前）
function streak(h){
  if(!h.createdDate)return 0;
  let n=0, cur=new Date();
  const todayV=state.checkins[h.id]?.[today()];
  if(!todayV){
    const now=new Date();
    const todayMid=new Date(); todayMid.setHours(12,0,0,0);
    if(now<todayMid){ cur=addDays(cur,-1); }
    else{ return 0; }
  }
  const first=new Date(h.createdDate);first.setHours(0,0,0,0);
  while(cur>=first){
    const ds=iso(cur);
    if(!state.checkins[h.id]?.[ds] && !habitScheduled(h,ds)){cur=addDays(cur,-1);continue}
    if(!state.checkins[h.id]?.[ds])break;
    n++;cur=addDays(cur,-1);
  }
  return n;
}
/* ===== 圖示系統 ===== */
const ICONS={
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  coffee:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M17 8h1a3 3 0 0 1 0 6h-1M3 8h14v7a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8zm5-3c0-1 1-1 1-2m4 2c0-1 1-1 1-2"/></svg>',
  run:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="13" cy="4" r="2"/><path d="M10 20l1-6 3 2 1 4M12 14l-2-3 1-2 3 1 3 1"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  water:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 2s6 7 6 12a6 6 0 0 1-12 0c0-5 6-12 6-12z"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>',
  work:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 12h18"/></svg>',
  meditate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM5 21l3-5 4 1 4-1 3 5M12 13v4"/></svg>',
  walk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="13" cy="3" r="1.8"/><path d="M11 21l1-5 3 1 1 4M12 16l-1-3 2-2 3 1"/></svg>',
  pill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="10" width="18" height="5" rx="2.5" transform="rotate(-45 12 12.5)"/></svg>',
  shower:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 3v5m4-5v5m4-5v5m4-5v5M4 13h16a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2z"/></svg>',
  bed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M2 9v10m0-5h20v5M2 14h20M6 9V6h12v3"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m12 3 2.7 5.6 6.3.9-4.5 4.4 1 6.1L12 17.8 6.5 20l1-6.1L3 9.5l6.3-.9L12 3z"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 21V4m0 0c2-1 4 1 6 1s4-2 6-1v9c-2-1-4 1-6 1s-4-2-6-1"/></svg>',
  dish:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 13a8 8 0 0 1 16 0M2 17h20"/></svg>'
};
const COLORS=['#4CD964','#5aa9ff','#f5b942','#ff6b6b','#b07cff','#ff9de2','#4cd9c0','#ff8c5a'];

/* ===== 應用狀態 ===== */
let curMonth=new Date(); // 月曆顯示的月份
let curView='habits';
let freqFilter='all', catFilter='all';
let todoFilter='all';
let dashMode='month';
let schMode='month';            // 時間表：month 月曆 / axis 時間軸
let schType='once';             // 時間軸模式：once 一次性 / week 每週重複
let schDate=today();            // 時間軸當前日期
let schDetailDate=null;         // 月曆點選的日期
let detailHabitId=null, detailRange='month';

const $=id=>document.getElementById(id);
const $$=s=>document.querySelectorAll(s);

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function confetti(){const c=['#4CD964','#5aa9ff','#f5b942','#ff6b6b','#b07cff'];for(let i=0;i<40;i++){const e=document.createElement('div');e.className='confetti';
  e.style.left=Math.random()*100+'vw';e.style.top='-10px';e.style.background=c[i%c.length];e.style.transform=`rotate(${Math.random()*360}deg)`;
  e.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),1600)}}

/* ===== 成就系統 ===== */
function unlock(id){
  if(state.achievements[id])return false;
  state.achievements[id]=Date.now();persist();
  const def=ACH[id];if(def){showAchPopup(def);confetti()}
  return true;
}
const ACH={
  first:{name:'初次點亮',desc:'完成第一次打卡',icon:'star'},
  s7:{name:'連續 7 天',desc:'連續一週點亮綠燈',icon:'flame'},
  s30:{name:'連續 30 天',desc:'一個月的堅持',icon:'flame'},
  s100:{name:'連續 100 天',desc:'百日光輝',icon:'crown'},
  perfect:{name:'滿分一日',desc:'單日完成所有習慣',icon:'check'},
  guard:{name:'紀錄守護牌',desc:'累計達成 50 次',icon:'shield'},
  master:{name:'習慣大師',desc:'建立 5 個習慣',icon:'trophy'}
};
function showAchPopup(def){

/* ===== 月曆與星期條 ===== */
function renderWeekstrip(){
  const strip=$('weekstrip');strip.innerHTML='';
  const wd=['日','一','二','三','四','五','六'];
  wd.forEach(w=>{const d=document.createElement('div');d.className='wd';d.textContent=w;strip.appendChild(d)});
  const first=new Date(curMonth.getFullYear(),curMonth.getMonth(),1);
  const start=new Date(first);start.setDate(1-first.getDay());
  const todayStr=today();
  for(let i=0;i<7;i++){
    const d=addDays(start,i);const ds=iso(d);
    const el=document.createElement('div');el.className='day'+(ds===todayStr?' today':'');
    el.textContent=d.getDate();
    // 當天有任一打卡 -> 小點
    const any=state.habits.some(h=>state.checkins[h.id]?.[ds]);
    if(any)el.classList.add('hit');
    el.onclick=()=>{ if(ds===todayStr){gotoToday()} else {toast('切換至該日查看（目前僅支援今日打卡）')} };
    strip.appendChild(el);
  }
}
function renderMonthLabel(){$('monthLabel').textContent=`${curMonth.getFullYear()}年${curMonth.getMonth()+1}月`}
function gotoToday(){curMonth=new Date();renderMonthLabel();renderWeekstrip();renderHabits()}

/* ===== 分類篩選 ===== */
function renderCatChips(){
  const cats=[...new Set(state.habits.map(h=>h.category||'未分類'))];
  // 依 catOrder 排序，未記錄的排最後
  cats.sort((a,b)=>{const ia=state.catOrder.indexOf(a),ib=state.catOrder.indexOf(b);
    return (ia<0?999:ia)-(ib<0?999:ib)});
  const box=$('catChips');box.innerHTML='';
  const all=document.createElement('button');all.className='chip'+(catFilter==='all'?' on':'');all.innerHTML='<span class="dot" style="background:var(--green)"></span>全部';
  all.onclick=()=>{catFilter='all';renderCatChips();renderHabits()};box.appendChild(all);
  cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(catFilter===c?' on':'');b.draggable=true;b.dataset.cat=c;
    b.innerHTML=`<span class="dot" style="background:${catColor(c)}"></span>${c}`;
    b.onclick=()=>{catFilter=c;renderCatChips();renderHabits()};box.appendChild(b)});
  // 分類拖動排序
  let dragCat=null;
  box.querySelectorAll('.chip[draggable]').forEach(ch=>{
    ch.addEventListener('dragstart',()=>{dragCat=ch.dataset.cat;ch.style.opacity=.4});
    ch.addEventListener('dragend',()=>{ch.style.opacity=1;dragCat=null});
    ch.addEventListener('dragover',e=>e.preventDefault());
    ch.addEventListener('drop',()=>{if(!dragCat||dragCat===ch.dataset.cat)return;
      const arr=[...box.querySelectorAll('.chip[draggable]')];
      const from=arr.findIndex(x=>x.dataset.cat===dragCat);const to=arr.findIndex(x=>x.dataset.cat===ch.dataset.cat);
      if(from<to)box.insertBefore(arr[from],arr[to].nextSibling);else box.insertBefore(arr[from],arr[to]);
      state.catOrder=[...box.querySelectorAll('.chip[draggable]')].map(x=>x.dataset.cat);
      persist();

}

/* ===== 打卡 ===== */
function toggleCheckin(h){
  const ds=today();const c=state.checkins[h.id]=state.checkins[h.id]||{};
  if(c[ds]!==undefined){ // 已打卡 -> 取消確認
    confirmDialog('取消達成','取消達成後，已記錄的內容也會隨之刪除。確定要取消嗎？',()=>{
      delete c[ds];persist();renderHabits();renderWeekstrip();toast('已取消打卡');updateTopRight();
    });
    return;
  }
  if(h.record_type==='time'){openTimePicker(h);return}
  c[ds]=true;persist();
  checkAchievements(h);renderHabits();renderWeekstrip();updateTopRight();
  toast('已點亮綠燈！');confetti();
}
function openTimePicker(h){
  const c=state.checkins[h.id]=state.checkins[h.id]||{};
  const ds=today();const cur=c[ds];
  const quicks=h.reminderTime?[h.reminderTime,shiftTime(h.reminderTime,-15),shiftTime(h.reminderTime,15)]:['07:00','08:00','23:00'];
  const uniq=[...new Set(quicks)];
  overlay.innerHTML=`<div class="sheet">
    <div class="s-head"><h3>記錄「${h.name}」時間</h3><button class="close" data-close><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>

    <div class="s-actions">
      <button class="btn ghost" id="tCancel" ${cur?'':'style="display:none"'}>取消打卡</button>
      <button class="btn primary" id="tSave">${cur?'更新時間':'記錄'}</button>
    </div></div>`;
  showOverlay();
  const tq=$('tq');
  uniq.forEach(t=>{const b=document.createElement('button');b.className='timequick-btn';b.textContent=t;
    b.onclick=()=>{tq.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('tInput').value=t};
    if(t===cur)b.classList.add('on');tq.appendChild(b)});
  $('tCancel')&&($('tCancel').onclick=()=>{delete c[ds];persist();closeOverlay();renderHabits();renderWeekstrip();updateTopRight();toast('已取消打卡')});
  $('tSave').onclick=()=>{
    const v=$('tInput').value;if(!v){toast('請選擇時間');return}
    c[ds]=v;persist();closeOverlay();checkAchievements(h);renderHabits();renderWeekstrip();updateTopRight();

function shiftTime(t,min){const[d,mm]=t.split(':').map(Number);const x=new Date();x.setHours(d,mm+min,0,0);return pad(x.getHours())+':'+pad(x.getMinutes())}
function checkAchievements(h){
  if(h._first){return} h._first=true;
  unlock('first');
  const st=streak(h);
  if(st>=7)unlock('s7');if(st>=30)unlock('s30');if(st>=100)unlock('s100');
  // 單日全完成
  const all=state.habits.filter(x=>habitScheduled(x,today()));
  if(all.length&&all.every(x=>state.checkins[x.id]?.[today()]!==undefined))unlock('perfect');
  const total=Object.values(state.checkins).reduce((s,o)=>s+Object.keys(o).length,0);
  if(total>=50)unlock('guard');
  if(state.habits.length>=5)unlock('master');
}

/* ===== 儀表板 ===== */
function monthStats(){
  const y=curMonth.getFullYear(),m=curMonth.getMonth();
  const days=new Date(y,m+1,0).getDate();
  return state.habits.map(h=>{
    let done=0,scheduled=0;
    for(let d=1;d<=days;d++){const ds=`${y}-${pad(m+1)}-${pad(d)}`;if(!habitScheduled(h,ds))continue;scheduled++;
      if(state.checkins[h.id]?.[ds]!==undefined)done++}
    return {h,done,scheduled,days,rate:scheduled?Math.round(done/scheduled*100):0};
  });
}

      return `<div class="card" style="padding:10px 14px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div class="hs-icon" style="width:30px;height:30px;background:${h.color}22;color:${h.color}">${ICONS[h.icon]||ICONS.star}</div><b style="font-size:14px">${h.name}</b></div>
      <div style="display:flex">${cells}</div><div style="font-size:12px;color:var(--dim);margin-top:6px">本週達成 ${done}/7</div></div>`;
    }).join('');
    const todayDone=state.habits.filter(h=>state.checkins[h.id]?.[today()]!==undefined).length;
    box.innerHTML=`<div class="stat-grid">
      <div class="stat"><div class="num">${start.getDate()}-${addDays(start,6).getDate()}</div><div class="lbl">本週 ${curMonth.getFullYear()}年${curMonth.getMonth()+1}月</div></div>
      <div class="stat"><div class="num">${todayDone}</div><div class="lbl">今日達成</div></div>
      <div class="stat"><div class="num">${state.habits.length}</div><div class="lbl">習慣數</div></div>
    </div>${rows||emptyHtml('dash','本週沒有習慣資料','')}`;
  }
  else{ // green streak
    const top=state.habits.map(h=>({h,st:streak(h)})).sort((a,b)=>b.st-a.st);
    const best=top.length?top[0].st:0;
    box.innerHTML=`<div class="stat-grid">
      <div class="stat"><div class="num">${best}</div><div class="lbl">最高連續</div></div>
      <div class="stat"><div class="num">${state.habits.length}</div><div class="lbl">習慣</div></div>
      <div class="stat"><div class="num">${Object.values(state.checkins).reduce((s,o)=>s+Object.keys(o).length,0)}</div><div class="lbl">累計達成</div></div>
    </div>`;
    if(!top.length){box.insertAdjacentHTML('beforeend',emptyHtml('dash','還沒有連續紀錄',''));return}
    top.forEach(({h,st})=>{box.insertAdjacentHTML('beforeend',`<div class="card habit-stat" data-habit="${h.id}">
      <div class="hs-icon" style="background:${h.color}22;color:${h.color}">${ICONS[h.icon]||ICONS.star}</div>
      <div class="hs-meta"><div class="hs-name">${h.name}</div><div class="hs-sub">連續點亮</div></div>
      <div style="font-weight:800;font-size:24px;color:var(--green)">${st}<span style="font-size:13px"> 天</span></div>
    </div>`)});
    box.querySelectorAll('[data-habit]').forEach(el=>el.onclick=()=>openDetail(el.dataset.habit));
  }
}
function daysOfMonth(y,m){const n=new Date(y,m+1,0).getDate();const arr=[];for(let d=1;d<=n;d++)arr.push(`${y}-${pad(m+1)}-${pad(d)}`);return arr}
function miniGrid(h,days){

}

function trendData(h,range){
  const c=state.checkins[h.id]||{};
  const days=[];
  const n=range==='month'?new Date(curMonth.getFullYear(),curMonth.getMonth()+1,0).getDate():+range;
  if(range==='month'){for(let d=1;d<=n;d++)days.push(`${curMonth.getFullYear()}-${pad(curMonth.getMonth()+1)}-${pad(d)}`)}
  else{const todayD=new Date();for(let i=n-1;i>=0;i--)days.push(iso(addDays(todayD,-i)))}
  const pts=days.filter(d=>c[d]!==undefined).map(d=>({d,v:c[d]}));
  const labels=days.map(d=>{const p=d.split('-');return `${+p[1]}/${+p[2]}`});
  const values=days.map(d=>c[d]!==undefined?(typeof c[d]==='string'?c[d]:1):null);
  return {labels,values,pts};
}
function drawTrend(h){
  const box=$('trendChart');if(!box)return;
  const {labels,values}=trendData(h,detailRange);
  const isTime=h.record_type==='time';
  if(typeof echarts!=='undefined'){
    const chart=echarts.init(box);
    const data=isTime?values.map((v,i)=>v?{value:i,custom:v}:null):values;
    chart.setOption({
      backgroundColor:'transparent',
      grid:{left:isTime?46:30,right:12,top:14,bottom:24},
      tooltip:{trigger:'axis',backgroundColor:'#18231b',borderColor:'#2c3d30',textStyle:{color:'#e8efe9',fontSize:12},
        formatter:p=>{if(isTime&&p[0]){const i=p[0].dataIndex;return `${labels[i]}<br/>${values[i]}`}return p[0]?`${labels[p[0].dataIndex]}<br/>達成`:'無資料'}},
      xAxis:{type:'category',data:labels,axisLine:{lineStyle:{color:'#2c3d30'}},axisLabel:{color:'#5f7164',fontSize:10,interval:Math.ceil(labels.length/8)},axisTick:{show:false}},
      yAxis:isTime?{type:'category',data:[...new Set(values.filter(Boolean))].sort(),axisLabel:{color:'#5f7164',fontSize:10},axisLine:{show:false},axisTick:{show:false}}
        :{type:'value',max:1,min:0,splitLine:{lineStyle:{color:'#223026'}},axisLabel:{color:'#5f7164',fontSize:10,formatter:v=>v? '✓':'·'}},
      series:[{type:'line',data,connectNulls:false,smooth:true,symbolSize:7,lineStyle:{color:'#4CD964',width:2.4},
        itemStyle:{color:'#4CD964'},areaStyle:{color:'rgba(76,217,100,.12)'},
        markLine:isTime&&h.reminderTime?{symbol:'none',data:[{yAxis:h.reminderTime}],lineStyle:{color:'rgba(245,185,66,.6)',type:'dashed'},label:{show:true,formatter:'目標 '+h.reminderTime,color:'#f5b942',fontSize:10}}:undefined}]
    });
    return;
  }
  // 降級：內聯 SVG 折線圖（離線可用）
  const W=620,H=200,P=38,PL=10;
  const pts=values.map((v,i)=>v!==null&&v!==undefined?{i,v}:null).filter(Boolean);
  const hasData=pts.length>0;
  if(!hasData){box.innerHTML='<div class="hint" style="display:grid;place-items:center;height:100%">本月還沒有打卡記錄</div>';return}
  let minY,maxY;const nums=pts.map(p=>typeof p.v==='string'?p.v.replace(':','.'):p.v);
  if(isTime){const arr=pts.map(p=>p.v).sort();minY=arr[0];maxY=arr[arr.length-1]}
  else{minY=0;maxY=1}
  const n=values.length;
  const X=i=>PL+(n===1?W/2:(W-PL*2)*i/(n-1))+PL;
  const Yv=v=>{if(isTime){const t=v.replace(':','.');const r=(parseFloat(t)-parseFloat(minY.replace(':','.')))/((parseFloat(maxY.replace(':','.'))-parseFloat(minY.replace(':','.')))||1);return H-PL-r*(H-PL*2)}return v?PL: H-PL};
  let path='',circles='';
  pts.forEach((p,k)=>{const x=X(p.i),y=Yv(p.v);path+=`${k?'L':'M'}${x.toFixed(1)},${y.toFixed(1)} `;circles+=`<circle cx="${x}" cy="${y}" r="4" fill="#4CD964"/><text x="${x}" y="${y-9}" text-anchor="middle" font-size="10" fill="#93a89a">${p.v}</text>`});
  const lineLabel=isTime&&h.reminderTime?`<line x1="${PL}" y1="${Yv(h.reminderTime)}" x2="${W-PL}" y2="${Yv(h.reminderTime)}" stroke="rgba(245,185,66,.6)" stroke-dasharray="4 4"/><text x="${W-PL}" y="${Yv(h.reminderTime)-5}" text-anchor="end" font-size="10" fill="#f5b942">目標 ${h.reminderTime}</text>`:'';
  const step=Math.max(1,Math.floor(n/8));
  let xlabels='';values.forEach((v,i)=>{if(i%step===0)xlabels+=`<text x="${X(i)}" y="${H-2}" text-anchor="middle" font-size="10" fill="#5f7164">${labels[i]}</text>`});
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%">
    <line x1="${PL}" y1="${H-PL}" x2="${W-PL}" y2="${H-PL}" stroke="#2c3d30"/>
    <path d="${path.trim()}" fill="none" stroke="#4CD964" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${circles}${lineLabel}${xlabels}</svg>`;
}

/* ===== 時間表：資料輔助 ===== */
function dayBlocks(ds){if(!state.schedule[ds])state.schedule[ds]={};return state.schedule[ds]}
function taskName(id){const t=state.tasks.find(x=>x.id===id);if(t)return t.name;const td=state.todos.find(x=>x.id===id);return td?td.title:'未知任務'}
function taskColor(id){const t=state.tasks.find(x=>x.id===id);if(t)return t.color;const td=state.todos.find(x=>x.id===id);return td?td.color||COLORS[4]:COLORS[4]}
function blockLabel(b){
  const s=b.start??0,e=b.end??(b.start+1);
  return `${pad(s)}:00-${pad(e)}:00`;
}
function daySummary(ds){
  const blocks=Object.values(dayBlocksAll(ds));
  let cnt=0,hrs=0;blocks.forEach(b=>{cnt++;hrs+=(b.end-(b.start??0))});
  return {cnt,hrs};
}

/* ===== 每週重複：資料輔助 ===== */
function weekOfDay(day){return state.weekly.filter(w=>w.day===day).sort((a,b)=>a.start-b.start)}
function dayOverrides(ds){return state.weeklyOvr[ds]||{}}
// 某日完整時間塊 = 當日一次性塊 + 每週重複塊（自動帶入，扣除隱藏、套用完成覆寫）
function dayBlocksAll(ds){
  const out={};
  Object.entries(dayBlocks(ds)).forEach(([k,b])=>{out[k]={...b}});
  const dow=new Date(ds+'T12:00:00').getDay();
  weekOfDay(dow).forEach(w=>{
    const ov=dayOverrides(ds)[w.id];
    if(ov&&ov.hidden)return;
    out['w_'+w.id]={taskId:w.taskId,start:w.start,end:w.end,done:!!(ov&&ov.done),templateId:w.id,recur:true};
  });
  return out;
}
// 移除每週範本項目時，順手清掉所有日期的對應覆寫
function removeWeeklyTemplate(id){
  state.weekly=state.weekly.filter(w=>w.id!==id);
  Object.keys(state.weeklyOvr).forEach(ds=>{delete state.weeklyOvr[ds][id];if(!Object.keys(state.weeklyOvr[ds]).length)delete state.weeklyOvr[ds]});
}

      <span class="dnum${ds===todayStr?'':' fade'}">${d.getDate()}</span>

/* ===== 每週重複：週視圖（範本編輯） ===== */
const WK_DAYS=[1,2,3,4,5,6,0]; // 週一至週日
const WK_LABEL={1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',0:'日'};
const WK_H=25;
function renderWeekView(){
  const body=$('schTypeBody');if(!body)return;
  body.innerHTML=`
    <div class="weekgrid" id="weekGrid">
      ${WK_DAYS.map(d=>`<div class="wk-dow${d===new Date().getDay()?' today':''}">週${WK_LABEL[d]}</div>`).join('')}
      ${WK_DAYS.map(d=>`<div class="wk-col" data-day="${d}"></div>`).join('')}
    </div>
    <div class="hint" style="margin:8px 2px">一格 = 1 小時；拖動色塊可改時段（上下）或改星期（左右）。</div>`;
  const grid=$('weekGrid');
  grid.querySelectorAll('.wk-col').forEach(col=>{
    for(let h=0;h<24;h++){
      const hr=document.createElement('div');hr.className='wk-hourrow';hr.dataset.hour=h;
      hr.style.top=(h*WK_H)+'px';
      if(h%6===0)hr.style.borderBottomColor='var(--line2)';
      col.appendChild(hr);
    }
  });
  renderWeekBlocks();
  // 任務庫拖入：建立每週範本
  grid.querySelectorAll('.wk-hourrow').forEach(hr=>{
    hr.addEventListener('dragover',e=>e.preventDefault());
    hr.addEventListener('drop',e=>{
      e.preventDefault();
      const tid=e.dataTransfer.getData('text/task')||e.dataTransfer.getData('text/todo');
      if(!tid)return;
      const day=+hr.closest('.wk-col').dataset.day;const hour=+hr.dataset.hour;
      state.weekly.push({id:uid(),day,start:hour,end:hour+1,taskId:tid});
      persist();renderWeekBlocks();
      toast(`已加入每週重複：週${WK_LABEL[day]} ${pad(hour)}:00`);
    });
  });
}
function renderWeekBlocks(){
  const grid=$('weekGrid');if(!grid)return;
  grid.querySelectorAll('.wk-block').forEach(b=>b.remove());
  state.weekly.forEach(w=>{
    const col=grid.querySelector(`.wk-col[data-day="${w.day}"]`);if(!col)return;
    const dur=Math.max(1,w.end-w.start);
    const el=document.createElement('div');el.className='wk-block';el.dataset.wid=w.id;
    el.style.top=(w.start*WK_H)+'px';el.style.height=(dur*WK_H-3)+'px';
    el.style.background=taskColor(w.taskId);
    el.innerHTML=`<div class="wk-name">${taskName(w.taskId)}</div><div class="wk-time">${pad(w.start)}:00-${pad(w.end)}:00</div><span class="wk-x" data-wx="${w.id}">×</span>`;
    col.appendChild(el);
  });
  // × 刪除範本項目
  grid.querySelectorAll('.wk-x').forEach(x=>x.onclick=e=>{
    e.stopPropagation();
    const id=x.dataset.wx;const w=state.weekly.find(t=>t.id===id);if(!w)return;
    confirmDialog('從每週範本移除',`確定要移除「${taskName(w.taskId)}」每週${WK_LABEL[w.day]} ${pad(w.start)}:00 的重複安排嗎？`,()=>{
      removeWeeklyTemplate(id);persist();renderWeekBlocks();refreshSchedule();toast('已移除每週重複');
    },'移除');
  });
  // 拖動色塊：改時段（上下）／改星期（左右）
  grid.querySelectorAll('.wk-block').forEach(blk=>{
    const wid=blk.dataset.wid;
    blk.addEventListener('pointerdown',e=>{
      if(e.target.closest('.wk-x'))return;
      const w=state.weekly.find(t=>t.id===wid);if(!w)return;
      blk.setPointerCapture(e.pointerId);
      const dur=Math.max(1,w.end-w.start);
      const startPt={y:e.clientY,x:e.clientX,start:w.start};
      const cols=[...grid.querySelectorAll('.wk-col')];
      const colRects=cols.map(c=>c.getBoundingClientRect());
      blk.style.cursor='grabbing';
      const onMove=ev=>{
        let day=w.day;
        for(let i=0;i<cols.length;i++){if(ev.clientX>=colRects[i].left&&ev.clientX<colRects[i].right){day=+cols[i].dataset.day;break}}
        let hour=startPt.start+Math.round((ev.clientY-startPt.y)/WK_H);
        if(hour<0)hour=0;if(hour+dur>24)hour=24-dur;
        w.day=day;w.start=hour;w.end=hour+dur;
        const targetCol=grid.querySelector(`.wk-col[data-day="${day}"]`);
        if(targetCol&&blk.parentNode!==targetCol)targetCol.appendChild(blk);
        blk.style.top=(hour*WK_H)+'px';blk.style.height=(dur*WK_H-3)+'px';
        const t=blk.querySelector('.wk-time');if(t)t.textContent=`${pad(hour)}:00-${pad(hour+dur)}:00`;
      };
      const up=()=>{
        blk.removeEventListener('pointermove',onMove);blk.removeEventListener('pointerup',up);
        if(blk.releasePointerCapture)blk.releasePointerCapture(e.pointerId);
        blk.style.cursor='';
        persist();refreshSchedule();toast('每週重複已更新');
      };
      blk.addEventListener('pointermove',onMove);blk.addEventListener('pointerup',up);
    });
  });
}

        if(!Object.keys(state.weeklyOvr[ds]).length)delete state.weeklyOvr[ds];
      });
      persist();refreshSchedule();toast('已刪除任務')

function buildAxis(){

  const blocks=dayBlocksAll(ds);   // 一次性 + 每週重複（自動帶入）

            <div class="s-actions" style="margin-top:18px">

        $('wrNo').onclick=closeOverlay;
        $('wrDay').onclick=()=>{closeOverlay();
          const ov=state.weeklyOvr[ds]=state.weeklyOvr[ds]||{};
          ov[b.templateId]={hidden:true,done:!!(ov[b.templateId]&&ov[b.templateId].done)};
          persist();buildAxis();refreshSchedule();toast('今天已隱藏，每週範本不變')};
        $('wrAll').onclick=()=>{closeOverlay();
          removeWeeklyTemplate(b.templateId);persist();buildAxis();refreshSchedule();toast('已從每週範本移除')};
        return;
      }
      if(b.todoId){delete oneBlocks[blkId];persist();buildAxis();return}
      confirmDialog('移除安排',`確定要移除「${taskName(b.taskId)}」在 ${blockLabel(b)} 的安排嗎？（任務本身保留）`,()=>{
        delete oneBlocks[blkId];persist();buildAxis()
      },'移除');
    };
    // 拖到塊上也可放置（計算落點小時）
    el.addEventListener('dragover',e=>e.preventDefault());
    el.addEventListener('drop',e=>handleDrop(e,targetHour(e)));
    // 點擊標記完成（待辦聯動；每週重複塊只記當日完成）
    el.addEventListener('dblclick',()=>{
      if(b.recur){
        const ov=state.weeklyOvr[ds]=state.weeklyOvr[ds]||{};
        const cur=ov[b.templateId];
        ov[b.templateId]={hidden:!!(cur&&cur.hidden),done:!(cur&&cur.done)};
        persist();buildAxis();refreshSchedule();
        toast(ov[b.templateId].done?'今日已完成':'今日已取消完成');
        return;
      }
      const cur=oneBlocks[blkId];if(!cur)return;
      if(cur.todoId){const td=state.todos.find(x=>x.id===cur.todoId);if(td){
        td.done=!td.done;const nd=td.done;
        Object.keys(state.schedule).forEach(d=>{Object.values(state.schedule[d]).forEach(x=>{if(x.todoId===cur.todoId)x.done=nd})});
        persist();renderTodos();buildAxis();toast(nd?'待辦已完成':'已恢復待辦')
      }}else{cur.done=!cur.done;persist();buildAxis();toast(cur.done?'已標記完成':'已取消完成')}
    });
  });
  // 統一處理「任務/待辦拖入」與「塊移動」的放置
  function handleDrop(e,h){
    e.preventDefault();
    const type=e.dataTransfer.getData('text/task')||e.dataTransfer.getData('text/todo');
    const move=e.dataTransfer.getData('text/move');
    const blocks2=dayBlocks(ds);
    if(move){
      const cur=blocks2[move];if(!cur)return;
      const dur=(cur.end-(cur.start??0))||1;
      cur.start=h;cur.end=h+dur;
      if(cur.end>24){cur.end=24;cur.start=24-dur}
      persist();buildAxis();return
    }
    if(type){
      const isTodo=!!e.dataTransfer.getData('text/todo');
      const id=isTodo?e.dataTransfer.getData('text/todo'):e.dataTransfer.getData('text/task');
      if(!isTodo&&!state.tasks.find(x=>x.id===id))return;
      if(isTodo&&!state.todos.find(x=>x.id===id))return;
      // 每次拖入都生成新時間塊：同一任務可佔多個時間段
      const nb={taskId:id,start:h,end:h+1,done:false};
      if(isTodo)nb.todoId=id;
      blocks2[uid()]=nb;
      persist();buildAxis();toast(isTodo?'待辦已放入時間格':'已放入時間格');
    }
  }
  function targetHour(e){const rect=wrap.getBoundingClientRect();let h=Math.floor((e.clientY-rect.top)/HOURPX);if(h<0)h=0;if(h>23)h=23;return h}
  // 拖放目標：track
  wrap.querySelectorAll('.axis-track').forEach(tr=>{
    const h=+tr.dataset.track;
    tr.addEventListener('dragover',e=>{e.preventDefault()});
    tr.addEventListener('drop',e=>handleDrop(e,h));
  });
  // 調整大小：拖塊下邊緣（pointer 事件；即時更新、鬆手才重建）
  wrap.querySelectorAll('.blk-grip').forEach(g=>{
    const blkId=g.dataset.grip;
    g.addEventListener('pointerdown',e=>{
      e.stopPropagation();e.preventDefault();
      const b=dayBlocks(ds)[blkId];if(!b)return;
      const blkEl=g.closest('.axis-block');
      g.setPointerCapture(e.pointerId);
      const startY=e.clientY,startDur=b.end-(b.start??0);
      g.style.cursor='ns-resize';
      const onMove=ev=>{
        const dy=ev.clientY-startY;const add=Math.round(dy/HOURPX);
        let ns=startDur+add;if(ns<1)ns=1;if(ns>24-b.start)ns=24-b.start;
        b.end=b.start+ns;
        if(blkEl){blkEl.style.height=(b.end-b.start)*HOURPX-4+'px';const t=blkEl.querySelector('.blk-time');if(t)t.textContent=blockLabel(b)}
      };
      const up=()=>{
        g.removeEventListener('pointermove',onMove);g.removeEventListener('pointerup',up);
        if(g.releasePointerCapture)g.releasePointerCapture(e.pointerId);
        g.style.cursor='';
        persist();buildAxis();
      };
      g.addEventListener('pointermove',onMove);g.addEventListener('pointerup',up);
    });
  });
  // 移動塊：整塊拖動換時間段（pointer 事件；即時移動、鬆手才重建）
  wrap.querySelectorAll('.axis-block').forEach(blk=>{
    const blkId=blk.dataset.key;
    let startPt=null;
    blk.addEventListener('pointerdown',e=>{
      if(e.target.closest('.blk-grip')||e.target.closest('.blk-x'))return;
      const b=dayBlocks(ds)[blkId];if(!b)return;
      blk.setPointerCapture(e.pointerId);
      const dur=b.end-(b.start??0);
      startPt={y:e.clientY,start:b.start};
      blk.style.cursor='grabbing';
      const onMove=ev=>{
        const dy=ev.clientY-startPt.y;const delta=Math.round(dy/HOURPX);
        let ns=startPt.start+delta;if(ns<0)ns=0;if(ns+dur>24)ns=24-dur;
        b.start=ns;b.end=ns+dur;
        blk.style.top=ns*HOURPX+'px';
        const t=blk.querySelector('.blk-time');if(t)t.textContent=blockLabel(b);
      };
      const up=()=>{
        blk.removeEventListener('pointermove',onMove);blk.removeEventListener('pointerup',up);
        if(blk.releasePointerCapture)blk.releasePointerCapture(e.pointerId);
        blk.style.cursor='';
        persist();buildAxis();
      };
      blk.addEventListener('pointermove',onMove);blk.addEventListener('pointerup',up);
    });
  });
}

function switchView(v){
  curView=v;updateTopRight();
  $$('.view').forEach(s=>s.classList.remove('active'));
  $$('.nb').forEach(n=>n.classList.toggle('on',n.dataset.nav===v));
  if(v==='habits'){$('view-habits').classList.add('active');$('fab').style.display='';$('monthnavWrap').style.display='';$('weekstrip').style.display=''}
  else if(v==='todos'){$('view-todos').classList.add('active');$('fab').style.display='';$('monthnavWrap').style.display='none';$('weekstrip').style.display='none'}
  else if(v==='schedule'){$('view-schedule').classList.add('active');$('fab').style.display='';$('monthnavWrap').style.display='none';$('weekstrip').style.display='none';renderSchedule()}
  else if(v==='dash'){$('view-dash').classList.add('active');$('fab').style.display='none';$('monthnavWrap').style.display='none';$('weekstrip').style.display='none'}
  else if(v==='settings'){$('view-settings').classList.add('active');$('fab').style.display='none';$('monthnavWrap').style.display='none';$('weekstrip').style.display='none'}
  else if(v==='detail'){/* 每月記錄會重繪 main */}
}
